<div class="molecule-actions" role="group" [attr.aria-label]="ariaLabel">
    @for(button of buttonsGroupData; track button){
        <div class="action-item" [class.action-item--active]="isSelected(button.idButton)">
            <dsb-button-atom
                [idButton]="button.idButton"
                [type]="button.type"
                [text]="button.text"
                (clicker)="onEmit($event)">
            </dsb-button-atom>
        </div>
    }
</div>
