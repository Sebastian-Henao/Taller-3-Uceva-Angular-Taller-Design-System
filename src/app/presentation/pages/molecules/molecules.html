<dsb-container-atom title="Button Group" >
    <dsb-button-group-molecule 
        [buttonsGroupData]="buttonsGroupData" 
        ariaLabel="Acciones disponibles"
        (clicker)="onClick($event)" >
    </dsb-button-group-molecule>
    @if (selectedButtonId) {
        <p class="mt-3 mb-0" role="status">
            Botón seleccionado: <strong>{{ selectedButtonId }}</strong>
        </p>
    }
</dsb-container-atom>

<dsb-container-atom title="Nav Link" >
    <dsb-nav-link-molecule
        [navLinks]="navLinks"
        ariaLabel="Navegación del Showcase">
    </dsb-nav-link-molecule>
</dsb-container-atom>
